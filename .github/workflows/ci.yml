name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          shellcheck --version
          sh tests/lint.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install extra POSIX shells
        run: sudo apt-get update && sudo apt-get install -y dash busybox mksh yash
      - name: Run tests under every shell
        run: sh tests/run.sh
